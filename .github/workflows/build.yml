name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by update-lock.yml against its temp branch, so the lock bump is checked by this
  # file rather than by a copy of its commands
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      - name: VERSION matches CHANGELOG
        run: |
          ver=$(cat VERSION)
          grep -qF "## [$ver]" CHANGELOG.md || {
            echo "VERSION says $ver but CHANGELOG.md has no ## [$ver] heading" >&2
            exit 1
          }
      - run: nix build --no-write-lock-file .#ddlc-hyprlock
      # tests, dist-is-current, conf-shape, module-wiring, scripts-lint
      - run: nix flake check --no-write-lock-file
      # The lock screen must stay usable without Nix: install.sh renders the committed conf
      # under PREFIX, and the engine has to find its assets from its own location alone
      - name: install.sh works
        run: |
          PREFIX=$PWD/out ./install.sh
          test -f out/share/ddlc-hyprlock/hyprlock.conf
          test -f out/share/ddlc-hyprlock/glitch.frag
          test -f out/share/ddlc-hyprlock/install-manifest
          test -L out/bin/ddlc-hyprlock
          out/bin/ddlc-hyprlock --version | grep -xF "ddlc-hyprlock $(cat VERSION)"
          if grep -q '@share@' out/share/ddlc-hyprlock/hyprlock.conf; then exit 1; fi
          grep -q "$PWD/out/share/ddlc-hyprlock/just-monika.png" out/share/ddlc-hyprlock/hyprlock.conf
          DDLC_HYPRLOCK_HYPRLOCK=$PWD/tests/stub/hyprlock \
            STUB_HYPRLOCK_SLEEP=3 \
            DDLC_HYPRLOCK_GLITCH=0 \
            DDLC_HYPRLOCK_STATE_DIR=$PWD/state \
            out/bin/ddlc-hyprlock lock
          test -s "$PWD/state/frame"
          # Uninstall consumes the manifest and leaves nothing of ours behind
          PREFIX=$PWD/out ./install.sh --uninstall
          test ! -e out/bin/ddlc-hyprlock
          test ! -e out/share/ddlc-hyprlock
          DESTDIR=$PWD/stage PREFIX=/usr ./install.sh
          grep -q '/usr/share/ddlc-hyprlock/just-monika.png' stage/usr/share/ddlc-hyprlock/hyprlock.conf
          if grep -q "$PWD/stage" stage/usr/share/ddlc-hyprlock/hyprlock.conf; then exit 1; fi
          DESTDIR=$PWD/stage PREFIX=/usr ./install.sh --uninstall
          test ! -e stage/usr/share/ddlc-hyprlock
          DESTDIR=$PWD/stage-special PREFIX='/opt/a&b|c\d' ./install.sh
          special_conf=(stage-special/opt/*/share/ddlc-hyprlock/hyprlock.conf)
          test "${#special_conf[@]}" -eq 1
          grep -qF '/opt/a&b|c\d/share/ddlc-hyprlock/just-monika.png' "${special_conf[0]}"
          ! DESTDIR=$PWD/bad PREFIX=opt ./install.sh >/dev/null 2>&1
      - run: nix fmt -- --ci

  # The one file list lives in the flake's scripts-lint check — this job is a fast,
  # separately-named status for it, not a second copy of the commands
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: cachix/install-nix-action@v31
      # nix run/shell nixpkgs#tool is a mirror-fate lookup — whatever nixpkgs the runner
      # resolves today decides the job. Tools a workflow needs live in the flake's dev
      # shell, pinned by the lock, reached with nix develop
      - name: CI tools come from the lock, not the registry
        run: |
          if grep -rEn 'nix (run|shell) nixpkgs#' .github/workflows; then
            echo "unpinned registry lookup in a workflow — pin the tool in the flake's dev shell and use nix develop" >&2
            exit 1
          fi
      - run: nix build --no-write-lock-file .#checks.x86_64-linux.scripts-lint
